# SonarCloud runs in the pipeline only (no local Sonar). Organisation and project key are passed by the
# workflow from repository variables SONAR_ORGANIZATION / SONAR_PROJECT_KEY.
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Entry point only wires config, signals and exit codes.
sonar.coverage.exclusions=src/index.ts,tests/**,scripts/**,infra/**

# Test code is intentionally repetitive (arrange/act/assert); production code is held to the duplication gate.
sonar.cpd.exclusions=tests/**,scripts/**
sonar.exclusions=node_modules/**,dist/**,coverage/**,reports/**,.harness/**
