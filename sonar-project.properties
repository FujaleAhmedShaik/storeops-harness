# SonarCloud runs in the pipeline only (no local Sonar). Organisation and project key are passed by the
# workflow from repository variables SONAR_ORGANIZATION / SONAR_PROJECT_KEY.
# The project's analysis method must be "CI-based" in SonarCloud (turn Automatic Analysis off), or the scan is rejected.
sonar.sources=src,scripts,infra,.github/workflows,Dockerfile
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Entry point only wires config, signals and exit codes. Scripts, infrastructure and workflows are analysed for
# issues but are not unit-tested code, so they stay out of the coverage measure.
sonar.coverage.exclusions=src/index.ts,tests/**,scripts/**,infra/**,.github/**,Dockerfile

# Test code is intentionally repetitive (arrange/act/assert); production code is held to the duplication gate.
sonar.cpd.exclusions=tests/**,scripts/**
sonar.exclusions=node_modules/**,dist/**,coverage/**,reports/**,.harness/**,infra/main.arm.json

# Accepted risk, not a defect: the container registry and Key Vault keep public network access on because the deploy
# pipeline runs on GitHub-hosted runners (no private network path). Access is still Entra ID + RBAC only (registry
# admin user off, Key Vault RBAC authorization), over TLS. Same reasoning as the Checkov skips in .checkov.yaml.
sonar.issue.ignore.multicriteria=bicepPublicNetwork
sonar.issue.ignore.multicriteria.bicepPublicNetwork.ruleKey=azureresourcemanager:S6329
sonar.issue.ignore.multicriteria.bicepPublicNetwork.resourceKey=infra/main.bicep
